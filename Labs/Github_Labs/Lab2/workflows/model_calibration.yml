name: Periodic Model Calibration

on:
  schedule:
    - cron: '0 0 * * *'  # every day at midnight

jobs:
  calibrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.9

      - name: Install dependencies
        run: pip install -r Labs/Github_Labs/Lab2/requirements.txt

      - name: Generate timestamp
        run: |
          timestamp=$(date '+%Y%m%d%H%M%S')
          echo "$timestamp" > timestamp.txt
          echo "Timestamp for calibration: $timestamp"

      - name: Ensure directories exist
        run: |
          mkdir -p Labs/Github_Labs/Lab2/models
          mkdir -p Labs/Github_Labs/Lab2/metrics
          mkdir -p Labs/Github_Labs/Lab2/data
          mkdir -p Labs/Github_Labs/Lab2/mlruns

      - name: Train Model
        run: |
          timestamp=$(cat timestamp.txt)
          python Labs/Github_Labs/Lab2/src/train_model.py --timestamp "$timestamp"

      - name: Evaluate Model
        run: |
          timestamp=$(cat timestamp.txt)
          python Labs/Github_Labs/Lab2/src/evaluate_model.py --timestamp "$timestamp"

      - name: Debug files
        run: |
          echo "Models folder:"
          ls -l Labs/Github_Labs/Lab2/models
          echo "Metrics folder:"
          ls -l Labs/Github_Labs/Lab2/metrics

      - name: Commit and push
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add Labs/Github_Labs/Lab2/models/* Labs/Github_Labs/Lab2/metrics/*
          git commit -m "Add model + metrics for $(cat timestamp.txt)" || echo "Nothing to commit"
          git push origin main
        env:
        
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
