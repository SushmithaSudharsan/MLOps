name: Periodic Model Calibration

on: 
  schedule:
    - cron: '0 0 * * *'  # daily at midnight

jobs:
  calibrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.9

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and Store Timestamp
        run: |
          timestamp=$(date '+%Y%m%d%H%M%S')
          echo "$timestamp" > timestamp.txt
          echo "Timestamp for calibration: $timestamp"

      - name: Ensure directories exist
        run: |
          mkdir -p metrics
          mkdir -p models

      - name: Retrain Model
        run: |
          timestamp=$(cat timestamp.txt)
          echo "Retraining model with timestamp: $timestamp"
          python ./src/train_model.py --timestamp "$timestamp"

      - name: Evaluate Model and Log Metrics
        run: |
          timestamp=$(cat timestamp.txt)
          echo "Evaluating model with timestamp: $timestamp"
          python ./src/evaluate_model.py --timestamp "$timestamp"
          metrics_filename="${timestamp}_metrics.json"
          echo "Metrics file: $metrics_filename"
          mv $metrics_filename metrics/$metrics_filename
          ls -l metrics

      - name: Store and Version the New Model
        run: |
          timestamp=$(cat timestamp.txt)
          model_filename="model_${timestamp}_rf_model.joblib"
          echo "Moving model file: $model_filename"
          mv $model_filename models/$model_filename
          ls -l models

      - name: Commit and Push Changes
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          timestamp=$(cat timestamp.txt)
          metrics_filename="${timestamp}_metrics.json"
          model_filename="model_${timestamp}_rf_model.joblib"
          git add metrics/$metrics_filename models/$model_filename
          git commit -m "Add metrics and updated model for $timestamp" || echo "Nothing to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
