name: Scheduled Wine Model Retraining

on: 
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Labs/Github_Labs/Lab2/requirements.txt

    - name: Generate timestamp
      id: timestamp
      run: |
        timestamp=$(date '+%Y%m%d%H%M%S')
        echo "TIMESTAMP=$timestamp" >> $GITHUB_ENV
        echo "Generated timestamp: $timestamp"

    - name: Create necessary directories
      run: |
        mkdir -p Labs/Github_Labs/Lab2/models
        mkdir -p Labs/Github_Labs/Lab2/metrics
        mkdir -p Labs/Github_Labs/Lab2/plots

    - name: Retrain Wine Model
      run: |
        python Labs/Github_Labs/Lab2/src/train_model.py \
          --timestamp "${{ env.TIMESTAMP }}" \
          --model_type gradient_boosting \
          --n_estimators 100 \
          --learning_rate 0.1 \
          --max_depth 3

    - name: Evaluate Wine Model
      run: |
        python Labs/Github_Labs/Lab2/src/evaluate_model.py \
          --timestamp "${{ env.TIMESTAMP }}" \
          --model_type gradient_boosting

    - name: List generated files
      run: |
        echo "=== Models ==="
        ls -lh Labs/Github_Labs/Lab2/models/
        echo "=== Metrics ==="
        ls -lh Labs/Github_Labs/Lab2/metrics/
        echo "=== Plots ==="
        ls -lh Labs/Github_Labs/Lab2/plots/

    - name: Commit and push models + metrics
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"

        # Ensure directories exist
        mkdir -p Labs/Github_Labs/Lab2/models
        mkdir -p Labs/Github_Labs/Lab2/metrics

        # Add generated files
        git add Labs/Github_Labs/Lab2/models/* Labs/Github_Labs/Lab2/metrics/* || true

        # Add .gitkeep to keep folders if empty
        touch Labs/Github_Labs/Lab2/models/.gitkeep
        touch Labs/Github_Labs/Lab2/metrics/.gitkeep
        git add Labs/Github_Labs/Lab2/models/.gitkeep Labs/Github_Labs/Lab2/metrics/.gitkeep

        # Commit only if there are changes
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update models and metrics for $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin main
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}