name: Model Retraining on Push to Main

on:
  push:
    branches:
      - main

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: pip install -r requirements.txt

    # --------------------------------------------------
    # 1) Generate timestamp for file versioning
    # --------------------------------------------------
    - name: Generate Timestamp
      id: tstamp
      run: echo "ts=$(date '+%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

    # --------------------------------------------------
    # 2) Create directories for models/metrics if missing
    # --------------------------------------------------
    - name: Create directories
      run: |
        mkdir -p models
        mkdir -p metrics

    # --------------------------------------------------
    # 3) Ensure training script is executable
    # --------------------------------------------------
    - name: Make training script executable
      run: chmod +x ./src/train_model.py

    # --------------------------------------------------
    # 4) Train the model
    # --------------------------------------------------
    - name: Retrain Model
      run: python ./src/train_model.py --timestamp "${{ steps.tstamp.outputs.ts }}"

    # --------------------------------------------------
    # 5) Evaluate the model + save metrics file
    # --------------------------------------------------
    - name: Evaluate Model
      id: evalstep
      run: |
        timestamp="${{ steps.tstamp.outputs.ts }}"

        python ./src/evaluate_model.py --timestamp "$timestamp"

        metrics_file="${timestamp}_metrics.json"
        mv "$metrics_file" metrics/
        echo "metrics_path=metrics/$metrics_file" >> $GITHUB_OUTPUT

    # --------------------------------------------------
    # 6) Move the trained model into models/
    # --------------------------------------------------
    - name: Store Model Version
      id: modelstep
      run: |
        timestamp="${{ steps.tstamp.outputs.ts }}"

        # Your Wine dataset script saves model as:
        # model_<timestamp>_rf_model.joblib
        model_file="model_${timestamp}_rf_model.joblib"

        mv "$model_file" models/
        echo "model_path=models/$model_file" >> $GITHUB_OUTPUT

    # --------------------------------------------------
    # 7) Commit and push the updated model + metrics
    # --------------------------------------------------
    - name: Commit and Push Changes
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "github-actions"

        git add models/ metrics/

        git commit -m "Add model + metrics for ${{ steps.tstamp.outputs.ts }}" || \
          echo "No changes to commit."

        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
