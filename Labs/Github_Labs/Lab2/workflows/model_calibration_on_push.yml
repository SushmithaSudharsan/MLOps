name: Model Retraining on Push to Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Generate and Store Timestamp
      id: timestamp
      run: |
        ts=$(date '+%Y%m%d%H%M%S')
        echo "$ts" > timestamp.txt
        echo "timestamp=$ts" >> $GITHUB_OUTPUT

    - name: Ensure directories exist
      run: |
        mkdir -p models
        mkdir -p metrics

    - name: Clean old artifacts (do NOT delete data/)
      run: |
        rm -rf models/*
        rm -rf metrics/*

    - name: Retrain Model
      run: |
        python ./src/train_model.py --timestamp "${{ steps.timestamp.outputs.timestamp }}"

    - name: Evaluate Model and Log Metrics
      run: |
        timestamp="${{ steps.timestamp.outputs.timestamp }}"
        python ./src/evaluate_model.py --timestamp "$timestamp"

        metrics_file="metrics/${timestamp}_metrics.json"
        test -f "$metrics_file" && echo "✅ Metrics generated: $metrics_file" \
          || (echo "❌ Metrics file missing"; ls -la metrics; exit 1)

    - name: Run unit tests
      run: |
        pytest -v test/test_model_training.py
        pytest -v test/test_evaluate_model.py

    - name: Verify Model Exists
      run: |
        timestamp="${{ steps.timestamp.outputs.timestamp }}"
        model_file="models/model_${timestamp}_rf_model.joblib"
        test -f "$model_file" && echo "✅ Model generated: $model_file" \
          || (echo "❌ Model file missing"; ls -la models; exit 1)

    - name: Commit and Push Changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.email "sushmithagithubprojects@gmail.com"
        git config --global user.name "SushmithaSudharsan"

        timestamp="${{ steps.timestamp.outputs.timestamp }}"
        metrics_file="metrics/${timestamp}_metrics.json"
        model_file="models/model_${timestamp}_rf_model.joblib"

        git pull --rebase origin main || echo "Nothing to pull"

        git add "$metrics_file" "$model_file"
        git commit -m "Add updated model + metrics [push-triggered]" || echo "No changes to commit"

        git push || (git pull --rebase origin main && git push)
